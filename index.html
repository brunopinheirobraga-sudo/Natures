<style>
*{box-sizing:border-box}
body{margin:0;background:#211006;color:#fff;font-family:Arial,sans-serif}
.app{max-width:520px;margin:auto;padding:12px 12px 25px}
.top{text-align:center;padding:10px 10px 12px}
.logo{width:150px;height:150px;object-fit:cover;border-radius:2px;display:block;margin:auto}
h1{font-family:cursive;font-size:46px;line-height:1;color:#ffd52a;margin:16px 0 5px;font-style:italic}
.tag{font-family:cursive;font-size:28px;color:#ffd52a;font-weight:bold;margin:10px 0}
.sub{font-size:12px;letter-spacing:3px;font-weight:bold}
.box{border:2px solid #80532f;border-radius:18px;padding:18px;margin:12px 0;background:rgba(50,25,12,.55)}
.box.pix{border-color:#ffd52a}
.heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.heading h2{font-family:cursive;font-size:34px;font-style:italic;margin:0}
.price-head{background:#ffd52a;color:#241207;padding:8px 18px;border-radius:30px;font-family:cursive;font-size:20px;font-weight:bold}
.item{display:flex;align-items:center;border:2px solid #70472a;border-radius:18px;padding:12px;margin:9px 0;background:rgba(65,33,17,.45)}
.dot{width:22px;height:22px;border:4px solid #ffd52a;border-radius:50%;margin-right:14px;flex:none}
.name{font-family:cursive;font-size:27px;flex:1}
.price{background:#ffd52a;color:#241207;padding:8px 15px;border-radius:25px;font-family:cursive;font-size:19px;font-weight:bold;white-space:nowrap}
.pix-title{font-family:cursive;color:#ffd52a;font-size:30px;font-weight:bold;font-style:italic}
.key{font-size:22px;font-weight:bold;margin:8px 0 14px;word-break:break-all}
.copy{width:100%;border:0;background:#ffd52a;color:#241207;border-radius:28px;padding:13px;font-size:19px;font-weight:bold}
.status{min-height:20px;text-align:center;color:#ffd52a;font-size:13px;margin-top:7px}
.admin{border-color:#70472a}
.admin-head{display:flex;align-items:center;gap:12px}
.lock{font-size:42px}
.admin-title{flex:1;font-size:21px;font-weight:bold}
.admin-sub{font-size:13px;color:#ddd;margin-top:3px}
.enter{background:transparent;color:#ffd52a;border:2px solid #ffd52a!important;border-radius:30px!important;width:auto!important;padding:9px 18px!important}
.panel{display:none;margin-top:14px;background:#fff;color:#241207;border-radius:13px;padding:14px}
input{width:100%;padding:11px;margin:5px 0 8px;border:1px solid #aaa;border-radius:9px;font-size:16px}
.row{display:grid;grid-template-columns:1fr 100px 40px;gap:6px}
.row button{border:0;border-radius:8px;background:#eee;color:#a22}
.save{background:#ffd52a} .add{background:#59402c;color:#fff;margin-bottom:8px;width:100%}
.exit{background:#eee;width:100%;margin-top:8px}
.error{color:#a22;font-size:13px;margin-top:6px}
.online{font-size:12px;text-align:center;color:#d8c4b2;margin:5px 0}
.online.ok{color:#ffd52a}
footer{text-align:center;color:#ddd;font-family:cursive;font-size:20px;margin-top:15px}
</style>
</head>

<h1>Sabor da Casa</h1>
<div class="tag">♥</div>
<div class="sub">SABORES QUE FAZEM O DIA MAIS DOCE! 💛</div>
<div class="online" id="onlineStatus">Modo demonstração</div>
</section>

<section class="box">
<div class="heading">
<h2>Sabores</h2>
<div class="price-head">R$ Preço</div>
</div>
<div id="lista"></div>
</section>

<section class="box pix">
<div class="pix-title">💛 Pagamento via PIX</div>
<div style="margin-top:8px">Chave PIX (número de telefone):</div>
<div class="key" id="pixDisplay"></div>
<button class="copy" onclick="copiarPix()">▣ &nbsp; Copiar PIX</button>
<div class="status" id="status"></div>
</section>

<section class="box admin">
<div class="admin-head">
<div class="lock">🔒</div>
<div class="admin-title">
Área da Dona
<div class="admin-sub">Acesse para editar o cardápio</div>
</div>
<button class="enter" onclick="abrirLogin()">⚙️ Entrar</button>
</div>

<div class="panel" id="login">
<b id="loginTitulo">Acesso restrito</b>
<input id="email" type="email" autocomplete="username" placeholder="E-mail da dona" style="display:none">
<input id="senha" type="password" autocomplete="current-password" placeholder="Senha">
<button class="save" style="width:100%" onclick="entrar()">Entrar</button>
<div id="erro" class="error"></div>
<div id="demoHint" style="font-size:12px;color:#666;margin-top:7px">
Teste local: senha 1234
</div>
</div>

<div class="panel" id="editor">
<b>Editar cardápio</b>
<div id="campos"></div>
<button class="add" onclick="adicionar()">+ Adicionar sabor</button>
<label><b>Chave PIX</b></label>
<input id="pixInput" placeholder="Chave PIX">
<button class="save" style="width:100%" onclick="salvar()">💾 Salvar alterações</button>
<button class="exit" onclick="sair()">🔒 Sair</button>
</div>
</section>

<footer>Obrigada pela preferência! 💛</footer>
</div>

<script>
// ==========================================================
// CONFIGURAÇÃO ONLINE
// Cole aqui a configuração fornecida pelo Firebase.
// Não coloque senha de usuário neste arquivo.
// ==========================================================
const ONLINE_ATIVO = false;

const firebaseConfig = {
  apiKey: "COLE_AQUI",
  authDomain: "COLE_AQUI.firebaseapp.com",
  databaseURL: "https://COLE_AQUI-default-rtdb.firebaseio.com",
  projectId: "COLE_AQUI",
  storageBucket: "COLE_AQUI.appspot.com",
  messagingSenderId: "COLE_AQUI",
  appId: "COLE_AQUI"
};

let db = null;
let auth = null;

let sabores = JSON.parse(localStorage.getItem("nature_sabores") || "null") || [
  {nome:"Ninho",preco:"10,00"},
  {nome:"Chocolate",preco:"10,00"},
  {nome:"Morango",preco:"12,00"},
  {nome:"Prestígio",preco:"10,00"}
];

let pix = localStorage.getItem("nature_pix") || "17988093240";

function esc(v) {
  return String(v)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;");
}

function render() {
  lista.innerHTML = sabores.map(s =>
    `<div class="item">
      <span class="dot"></span>
      <span class="name">${esc(s.nome)}</span>
      <span class="price">R$ ${esc(s.preco)}</span>
    </div>`
  ).join("");

  pixDisplay.textContent = pix;
  pixInput.value = pix;
  renderCampos();
}

function renderCampos() {
  campos.innerHTML = sabores.map((s,i) =>
    `<div class="row">
      <input value="${esc(s.nome)}" oninput="sabores[${i}].nome=this.value" placeholder="Sabor">
      <input value="${esc(s.preco)}" oninput="sabores[${i}].preco=this.value" placeholder="Preço">
      <button onclick="sabores.splice(${i},1);renderCampos()">✕</button>
    </div>`
  ).join("");
}

function abrirLogin() {
  login.style.display = login.style.display === "block" ? "none" : "block";
  editor.style.display = "none";
  senha.value = "";
  email.value = "";
  erro.textContent = "";
}

async function iniciarOnline() {
  try {
    if (!ONLINE_ATIVO) return;

    firebase.initializeApp(firebaseConfig);
    auth = firebase.auth();
    db = firebase.database();

    document.getElementById("onlineStatus").textContent =
      "● Cardápio online — atualizações em tempo real";
    document.getElementById("onlineStatus").classList.add("ok");

    document.getElementById("email").style.display = "block";
    document.getElementById("demoHint").style.display = "none";

    // Todo mundo que abrir o cardápio recebe alterações automaticamente.
    db.ref("cardapio").on("value", snap => {
      const data = snap.val();
      if (!data) return;

      if (Array.isArray(data.sabores)) sabores = data.sabores;
      if (typeof data.pix === "string") pix = data.pix;
      render();
    });
  } catch (e) {
    console.error(e);
    document.getElementById("onlineStatus").textContent =
      "Não foi possível conectar ao modo online";
  }
}

async function entrar() {
  erro.textContent = "";

  if (!ONLINE_ATIVO) {
    if (senha.value === "1234") {
      login.style.display = "none";
      editor.style.display = "block";
      renderCampos();
    } else {
      erro.textContent = "Senha incorreta.";
    }
    return;
  }

  try {
    await auth.signInWithEmailAndPassword(email.value.trim(), senha.value);
    login.style.display = "none";
    editor.style.display = "block";
    renderCampos();
  } catch (e) {
    erro.textContent = "E-mail ou senha incorretos.";
  }
}

function adicionar() {
  sabores.push({nome:"Novo sabor",preco:"10,00"});
  renderCampos();
}

async function salvar() {
  pix = pixInput.value.trim();

  // Guarda uma cópia local.
  localStorage.setItem("nature_sabores", JSON.stringify(sabores));
  localStorage.setItem("nature_pix", pix);

  if (ONLINE_ATIVO && db && auth.currentUser) {
    try {
      await db.ref("cardapio").set({
        sabores: sabores,
        pix: pix,
        atualizadoEm: firebase.database.ServerValue.TIMESTAMP
      });
      alert("Cardápio atualizado para todo mundo! ✓");
    } catch (e) {
      alert("Não foi possível salvar online. Verifique a conexão.");
      console.error(e);
      return;
    }
  } else {
    alert("Cardápio salvo neste aparelho.");
  }

  render();
  editor.style.display = "none";
}

function sair() {
  editor.style.display = "none";
  login.style.display = "none";
  if (ONLINE_ATIVO && auth) auth.signOut();
}

async function copiarPix() {
  try {
    await navigator.clipboard.writeText(pix);
  } catch(e) {
    const t = document.createElement("textarea");
    t.value = pix;
    document.body.appendChild(t);
    t.select();
    document.execCommand("copy");
    t.remove();
  }

  status.textContent = "PIX copiado! ✓";
  setTimeout(() => status.textContent = "", 2200);
}

render();
iniciarOnline();
</script>
</body>
</html>
